<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f7ff;
            --panel: #ffffff;
            --line: rgba(148, 163, 184, 0.45);
            --text: #0f172a;
            --muted: #475569;
            --danger: #dc2626;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 45%, #eef2ff 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .panel {
            width: min(520px, 92vw);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 30px 24px;
        }
        .danger-badge {
            display: inline-block;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 { font-size: 2rem; margin-top: 18px; }
        p { color: var(--muted); }
        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-weight: 700;
        }
        .btn-secondary {
            background: #e2e8f0;
            border: 1px solid var(--line);
            color: #0f172a;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="panel text-center">
        <span class="danger-badge">Advertencia</span>
        <h1>Eliminar cuenta</h1>
        <p class="mt-3 mb-4">¿Estás seguro que deseas eliminar tu cuenta? Esta acción es permanente y no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <button type="submit" class="btn btn-danger px-4">Eliminar cuenta</button>
                <a href="{% url 'bienvenida' %}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
