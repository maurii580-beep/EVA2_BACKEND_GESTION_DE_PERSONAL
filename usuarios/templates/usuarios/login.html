<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketChile | Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f7ff;
            --panel: #ffffff;
            --panel-2: #edf4ff;
            --line: rgba(148, 163, 184, 0.45);
            --text: #0f172a;
            --muted: #475569;
            --primary: #2563eb;
            --primary-2: #1d4ed8;
            --accent: #f59e0b;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 45%, #eef2ff 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            width: min(460px, 92vw);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            padding: 28px 24px 22px;
        }
        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--accent);
            color: #172033;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(245, 158, 11, 0.3);
        }
        .brand-name {
            margin: 0;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
        }
        .brand-type {
            margin: 2px 0 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .auth-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        .auth-header .header-copy {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.78);
        }
        .auth-body {
            padding: 28px 24px 24px;
        }
        .auth-body p,
        .auth-body label,
        .auth-body .helptext,
        .auth-body .errorlist {
            color: var(--text);
        }
        .auth-body .helptext,
        .auth-body .errorlist {
            font-size: 0.9rem;
        }
        .auth-body .errorlist {
            color: #b91c1c;
            padding-left: 1rem;
            margin-bottom: 0.75rem;
        }
        .form-control, .form-control:focus {
            background: #f8fafc;
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 12px;
            padding: 0.8rem 0.9rem;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        label {
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            border: 0;
            width: 100%;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.20);
        }
        .text-link {
            color: var(--primary);
            text-decoration: none;
        }
        .text-link:hover {
            text-decoration: underline;
        }
        .text-muted {
            color: var(--muted) !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-lockup">
                <div class="brand-mark">MC</div>
                <div>
                    <p class="brand-name">MarketChile</p>
                    <p class="brand-type">Multitienda</p>
                </div>
            </div>
            <p class="mb-2 text-uppercase small text-white-50">Centro de operaciones</p>
            <h1>Iniciar sesión</h1>
            <p class="header-copy">Accede a la gestión interna de MarketChile.</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary mt-3">Ingresar</button>
            </form>

            <hr style="border-color: rgba(148,163,184,.2); margin: 24px 0 18px;">

            <p class="mb-0 text-center text-muted">
                ¿No tienes una cuenta?
                <a href="{% url 'registro' %}" class="text-link">Regístrate</a>
            </p>
        </div>
    </div>
</body>
</html>
