<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar eliminación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #09111d;
            --panel: #111827;
            --line: rgba(148, 163, 184, 0.18);
            --text: #e5edf9;
            --muted: #9db0c9;
            --danger: #f87171;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #162136 0%, #09111d 40%, #050c17 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .panel {
            width: min(560px, 92vw);
            background: rgba(17,24,39,0.96);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(2,6,23,0.45);
            padding: 30px 24px;
            text-align: center;
        }
        .danger-badge {
            display: inline-block;
            background: rgba(248,113,113,0.12);
            color: #fecaca;
            border: 1px solid rgba(248,113,113,0.25);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 { font-size: 2rem; margin-top: 18px; }
        p { color: var(--muted); }
        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-weight: 700;
        }
        .btn-secondary {
            background: rgba(148,163,184,0.12);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="panel">
        <span class="danger-badge">Confirmación</span>
        <h1>Eliminar empleado</h1>
        <p class="mt-3 mb-4 fs-5">¿Está seguro de que desea eliminar a <strong>{{ empleado.nombre }} {{ empleado.apellido }}</strong>?</p>
        <p class="mb-4"><em>Esta acción no se puede deshacer.</em></p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <button type="submit" class="btn btn-danger">Sí, eliminar empleado</button>
                <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
